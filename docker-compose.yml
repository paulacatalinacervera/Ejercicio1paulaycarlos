services:
  telemetry-app:
    build: .
    image: telemetry-app:3.5.2
    container_name: telemetry-app
    restart: unless-stopped
    user: spark
    ports:
      - "3003:3003"
      - "4040:4040"
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: telemetry-app
      SPARK_DRIVER_BIND: 0.0.0.0
      KAFKA_BOOTSTRAP_SERVERS: act1234-kafka-1:9093
      KAFKA_TOPIC: telemetry.server.metrics
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: telemetry_matchmaking
    volumes:
      - ./:/app
    command: ["python3", "app.py"]
    networks:
      - taller_default
      - act1234_default
      - mongo_network

  mongo:
    image: mongo:7
    container_name: telemetry-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mongo_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    networks:
      - mongo_network

networks:
  taller_default:
    name: taller-123_default
    external: true
  act1234_default:
    name: act1234_default
    external: true
  mongo_network:
    driver: bridge

volumes:
  mongo_data:
